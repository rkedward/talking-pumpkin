<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pumpkin Side Show</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; inset: 0; transform-origin: 50% 50%; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #clip { object-fit: contain; opacity: 0; transition: opacity .6s; background: #000; }
  #clip.on { opacity: 1; }
  #art { display: block; }
  #status { position: fixed; left: 8px; bottom: 6px; color: #555; font: 14px system-ui, sans-serif; }
  #status.big { inset: 0; display: grid; place-items: center; color: #ff8c1a; font-size: 18vmin; font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <video id="clip" playsinline preload="auto"></video>
  <canvas id="art"></canvas>
</div>
<div id="status">connecting to the pumpkin…</div>
<script type="module" src="window.js"></script>
</body>
</html>
