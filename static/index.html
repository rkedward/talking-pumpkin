<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talking Pumpkin</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 15px/1.4 system-ui, sans-serif; color: #eee; }
  body.hide-cursor { cursor: none; }
  #face { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #idle { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; z-index: 2;
          opacity: 0; pointer-events: none; transition: opacity 1s; }
  #face { transition: opacity 1s; }
  #corner { position: fixed; top: 0; left: 0; width: 60px; height: 60px; z-index: 4; }
  #debug { position: fixed; top: 10px; left: 10px; width: min(380px, calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow-y: auto; box-sizing: border-box; background: rgba(20,20,20,.94); border: 1px solid #444; border-radius: 8px; padding: 8px; z-index: 5; display: none; }
  #debug.on { display: block; }
  #video { width: 100%; background: #111; min-height: 120px; display: block; }
  #state { margin: 6px 0; font-weight: 600; color: #ffb347; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  [hidden] { display: none !important; }
  .row label.btn { background: #333; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px 10px; font-size: 14px; cursor: pointer; }
  .row select { background: #222; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 5px; font-size: 14px; }
  #aMsg { font-size: 13px; color: #ffcf8a; margin: 0 0 6px; }
  #aWrap { position: relative; margin-bottom: 6px; }
  #aImg { width: 100%; display: block; border-radius: 4px; }
  .handle { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 3px solid #ff8c1a; background: rgba(255, 140, 26, .35); touch-action: none; box-sizing: border-box; }
  .row button, #ask button { background: #333; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px 10px; font-size: 14px; }
  #log { height: 170px; overflow-y: auto; font-size: 13px; white-space: pre-wrap; border-top: 1px solid #333; padding-top: 4px; }
  #log .said { color: #ffcf8a; } #log .heard { color: #9fd7ff; } #log .info { color: #888; }
  #ask { display: flex; gap: 6px; margin-top: 6px; }
  #ask input { flex: 1; min-width: 0; background: #222; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px; font-size: 14px; }
  #help { position: fixed; right: 10px; bottom: 10px; background: rgba(20,20,20,.92); border: 1px solid #444; border-radius: 8px; padding: 10px 14px; z-index: 5; display: none; font-size: 13px; }
  #help.on { display: block; }
  kbd { background: #333; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<video id="idle" muted playsinline preload="auto"></video>
<div id="corner"></div>

<div id="debug">
  <img id="video" alt="camera view">
  <div id="state">connecting…</div>
  <div class="row">
    <button data-cmd="greet">Greet now</button>
    <button data-cmd="end">End visit</button>
    <button data-cmd="flip">Flip eyes</button>
    <button data-cmd="mute">Mute mic</button>
    <button data-cmd="guide">Guide</button>
    <button data-cmd="faces" title="Show each facial expression">Faces</button>
    <button data-cmd="echo_test" title="Plays a test sentence and listens at the same time: shows in the log how much of his own voice the mic array cancels">Echo test</button>
  </div>
  <div class="row" title="Speaker volume (saved on the Pi)">
    <label for="vol">Volume</label>
    <input id="vol" type="range" min="0" max="150" step="5" value="100">
    <span id="volVal">100%</span>
  </div>
  <div class="row" title="Line the face up with the pumpkin">
    <button data-key="ArrowLeft">←</button><button data-key="ArrowRight">→</button>
    <button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button>
    <button data-key="+">bigger</button><button data-key="-">smaller</button>
    <button data-key="[">⟲</button><button data-key="]">⟳</button>
  </div>
  <div class="row" id="windowRow" title="Side show windows (window projectors)">
    <select id="wscreen" title="Which window the W buttons and Summon test act on"><option value="">window</option></select>
    <button data-wcmd="summon">Summon test</button><button data-cmd="window_identify">Identify</button><button data-cmd="ghost_tour">Ghost tour</button>
    <button data-wkey="left">W ←</button><button data-wkey="right">W →</button>
    <button data-wkey="up">W ↑</button><button data-wkey="down">W ↓</button>
    <button data-wkey="bigger">W bigger</button><button data-wkey="smaller">W smaller</button>
    <button data-wkey="mirror">W mirror</button>
  </div>
  <div id="alignBox" title="Auto-align a projector from a phone photo">
    <div class="row">
      <select id="atarget" aria-label="Projector to align"><option value="face">Align: face</option></select>
      <button id="aStart">Show pattern</button>
      <label class="btn" for="aPhoto">Take photo</label><input id="aPhoto" type="file" accept="image/*" capture="environment" hidden>
      <button id="aDone">Done</button><button id="aUndo">Undo</button>
    </div>
    <div id="aMsg"></div>
    <div id="aPrev" hidden>
      <div id="aWrap"><img id="aImg" alt="Your photo, with the fit drawn on it"></div>
      <div class="row"><button id="aUse">Use my corners</button></div>
    </div>
  </div>
  <div id="log"></div>
  <form id="ask"><input id="askText" placeholder="Type a question as a trick-or-treater…" autocomplete="off"><button>Ask</button></form>
</div>

<div id="help">
  <b>Controls</b><br>
  <kbd>D</kbd> camera/debug panel (or tap the top-left corner) &nbsp; <kbd>H</kbd> this help<br>
  <kbd>G</kbd> greet now &nbsp; <kbd>Esc</kbd> end visit<br>
  <kbd>F</kbd> flip eye direction &nbsp; <kbd>M</kbd> mute/unmute mic<br>
  <kbd>←↑→↓</kbd> move face &nbsp; <kbd>+</kbd>/<kbd>-</kbd> size<br>
  <kbd>[</kbd>/<kbd>]</kbd> rotate &nbsp; <kbd>{</kbd>/<kbd>}</kbd> stretch &nbsp; <kbd>0</kbd> reset<br>
  <kbd>C</kbd> alignment guide &nbsp; <kbd>Enter</kbd> full screen
</div>

<script type="module" src="app.js"></script>
</body>
</html>
